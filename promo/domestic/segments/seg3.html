</p>
<h2>写在最后</h2>
<p>LLM 进入交易这个场景，现在缺的不是更多&quot;会炒股的 Agent&quot;，而是<strong>一套能判断 Agent 到底行不行</strong>的基础设施。没有规范考场，所有收益曲线都只是市场营销。</p>
