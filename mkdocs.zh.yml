site_name: TraderHarness
site_description: 面向 A 股的 AI / LLM 交易 Agent 回测框架：时点数据、实体掩码、渐进撮合、指纹回放与完整轨迹审计
site_url: https://hephaestlab.github.io/TraderHarness/zh/
site_author: HephaestLab
docs_dir: docs
repo_url: https://github.com/HephaestLab/TraderHarness
repo_name: HephaestLab/TraderHarness
edit_uri: edit/main/docs/
copyright: Apache-2.0 © HephaestLab

exclude_docs: |
  en/
  overrides/
  plans/
  design/pixel-trader-scene.md
  design/animation_preview.html
  v0.1.0-plan.md

theme:
  name: material
  language: zh
  custom_dir: docs/overrides
  logo: https://hephaestlab.github.io/TraderHarness/assets/logo.svg
  favicon: https://hephaestlab.github.io/TraderHarness/assets/logo.svg
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
  palette:
    - scheme: slate
      primary: black
      accent: green

extra:
  alternate:
    - name: English
      link: /TraderHarness/
      lang: en
    - name: 简体中文
      link: /TraderHarness/zh/
      lang: zh-CN

extra_javascript:
  - javascripts/masking-ab-showcase.js

extra_css:
  - stylesheets/masking-ab-showcase.css

plugins:
  - search:
      lang:
        - zh
        - en
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - meta
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - 概览: index.md
  - AI 炒股回测指南: guides/agent-stock-backtesting.md
  - Masked vs Unmasked: masking-ab-showcase.md
  - 快速上手: quickstart.md
  - 防数据泄漏: contamination.md
  - 核心架构: architecture.md
  - 项目对比: comparison.md
  - 多角色委员会: design/multi-role-agent.md
  - Agent 工具合同 v5: design/agent-tool-contract-v5.md
  - 强化学习与评测轨迹: training-data.md
  - 数据与许可: data.md
  - CLI 与本地 API: api.md
  - 扩展开发: extensions.md
  - 路线图: roadmap.md
  - 常见问题: faq.md
  - 发布分发手册: release-playbook.md
