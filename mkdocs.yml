site_name: TraderHarness
site_description: Leakage-resistant backtesting, deterministic replay, and auditable trajectories for autonomous LLM trading agents on China A-shares
site_url: https://hephaestlab.github.io/TraderHarness/
site_author: HephaestLab
docs_dir: docs/en
repo_url: https://github.com/HephaestLab/TraderHarness
repo_name: HephaestLab/TraderHarness
edit_uri: edit/main/docs/en/
copyright: Apache-2.0 © HephaestLab

theme:
  name: material
  language: en
  custom_dir: docs/overrides
  logo: https://hephaestlab.github.io/TraderHarness/assets/logo.svg
  favicon: https://hephaestlab.github.io/TraderHarness/assets/logo.svg
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
  palette:
    - scheme: slate
      primary: black
      accent: green

extra:
  alternate:
    - name: English
      link: /TraderHarness/
      lang: en
    - name: 简体中文
      link: /TraderHarness/zh/
      lang: zh-CN

extra_javascript:
  - javascripts/masking-ab-showcase.js

extra_css:
  - stylesheets/masking-ab-showcase.css

plugins:
  - search:
      lang: en
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - meta
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Agent Backtesting Guide: guides/agent-stock-backtesting.md
  - Masked vs Unmasked: masking-ab-showcase.md
  - Quickstart: quickstart.md
  - Preventing Data Leakage: contamination.md
  - Architecture: architecture.md
  - Comparison: comparison.md
  - Multi-role Committees: design/multi-role-agent.md
  - Agent Tool Contract v5: design/agent-tool-contract-v5.md
  - Trajectories for RL and Evaluation: training-data.md
  - Data and Licensing: data.md
  - Daily Paper Trading: paper-trading.md
  - CLI and Local API: api.md
  - Extensions: extensions.md
  - Roadmap: roadmap.md
  - FAQ: faq.md
  - Launch Playbook: release-playbook.md
